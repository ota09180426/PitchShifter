<!doctype html>
<html>
<head><meta charset="utf-8"><title>DSP test</title></head>
<body>
<pre id="out">running</pre>
<script>window.__PS_TEST__ = 'dsp';</script>
<script src="../yt-pitch-shifter.user.js"></script>
<script>
(function () {
  const SR = 48000;
  const N = 4096, OV = 8;
  const results = [];
  const ok = (name, pass, detail) => results.push((pass ? 'PASS ' : 'FAIL ') + name + '  ' + detail);

  function run(dsp, L, R, block) {
    const n = L.length;
    const oL = new Float32Array(n), oR = new Float32Array(n);
    for (let i = 0; i < n; i += block) {
      const m = Math.min(block, n - i);
      dsp.process(L.subarray(i, i + m), R.subarray(i, i + m), oL.subarray(i, i + m), oR.subarray(i, i + m), m);
    }
    return [oL, oR];
  }
  function sine(freq, sec, amp, ph) {
    const x = new Float32Array(Math.round(SR * sec));
    for (let i = 0; i < x.length; i++) x[i] = amp * Math.sin(2 * Math.PI * freq * i / SR + (ph || 0));
    return x;
  }
  function noise(sec, seed) {
    let s = seed || 1;
    const x = new Float32Array(Math.round(SR * sec));
    for (let i = 0; i < x.length; i++) { s = (s * 1103515245 + 12345) & 0x7fffffff; x[i] = (s / 0x7fffffff) * 2 - 1; }
    return x;
  }
  function rms(x, a, b) { let s = 0; for (let i = a; i < b; i++) s += x[i] * x[i]; return Math.sqrt(s / (b - a)); }
  function zcFreq(x, a, b) {
    let first = -1, last = -1, cnt = 0;
    for (let i = a + 1; i < b; i++) {
      if (x[i - 1] < 0 && x[i] >= 0) {
        const t = i - 1 + (-x[i - 1]) / (x[i] - x[i - 1]);
        if (first < 0) first = t;
        last = t; cnt++;
      }
    }
    return (cnt - 1) * SR / (last - first);
  }
  const db = (r) => 20 * Math.log10(r);

  // 1. 恒等変換（±0）で完全再構成されるか、遅延はいくつか
  {
    const dsp = new PitchShifterDSP(N, OV);
    const L = noise(1, 7), R = noise(1, 99);
    const [oL, oR] = run(dsp, L, R, 128);
    let bestD = -1, bestErr = Infinity;
    for (let D = 0; D <= N + 2 * (N / OV); D++) {
      let e = 0;
      for (let i = 0; i < L.length - D; i += 7) e = Math.max(e, Math.abs(oL[i + D] - L[i]), Math.abs(oR[i + D] - R[i]));
      if (e < bestErr) { bestErr = e; bestD = D; }
    }
    ok('identity reconstruction', bestErr < 1e-5, `latency=${bestD} samples (${(bestD / SR * 1000).toFixed(1)}ms), maxErr=${bestErr.toExponential(2)}, dsp.latency=${dsp.latency}`);
  }

  // 2. 正弦波のピッチ精度と音量
  for (const st of [-6, -3, -1, -0.5, 0.5, 1, 2, 5, 6]) {
    const dsp = new PitchShifterDSP(N, OV);
    dsp.setSemitones(st);
    const L = sine(440, 2, 0.5), R = sine(440, 2, 0.5);
    const [oL, oR] = run(dsp, L, R, 128);
    const a = SR * 0.5 | 0, b = L.length;
    const f = zcFreq(oL, a, b), fr = zcFreq(oR, a, b);
    const exp = 440 * Math.pow(2, st / 12);
    const cents = 1200 * Math.log2(f / exp);
    const g = db(rms(oL, a, b) / rms(L, a, b));
    ok(`sine 440Hz ${st > 0 ? '+' : ''}${st}st`, Math.abs(cents) < 3 && Math.abs(g) < 1.5 && Math.abs(f - fr) < 0.05,
      `out=${f.toFixed(2)}Hz exp=${exp.toFixed(2)}Hz err=${cents.toFixed(2)}cent gain=${g.toFixed(2)}dB`);
  }

  // 3. 低音（ベース帯）の精度
  for (const [freq, st] of [[55, 2], [82.41, -3], [110, 5]]) {
    const dsp = new PitchShifterDSP(N, OV);
    dsp.setSemitones(st);
    const L = sine(freq, 3, 0.5), R = sine(freq, 3, 0.5);
    const [oL] = run(dsp, L, R, 128);
    const a = SR | 0, b = L.length;
    const f = zcFreq(oL, a, b);
    const exp = freq * Math.pow(2, st / 12);
    const cents = 1200 * Math.log2(f / exp);
    ok(`bass ${freq}Hz ${st > 0 ? '+' : ''}${st}st`, Math.abs(cents) < 5, `out=${f.toFixed(2)}Hz exp=${exp.toFixed(2)}Hz err=${cents.toFixed(2)}cent`);
  }

  // 4. 左のみの音が右に漏れないか（定位の保持）
  {
    const dsp = new PitchShifterDSP(N, OV);
    dsp.setSemitones(3);
    const L = sine(440, 2, 0.5), R = new Float32Array(L.length);
    const [oL, oR] = run(dsp, L, R, 128);
    const a = SR * 0.5 | 0, b = L.length;
    const leak = db(rms(oR, a, b) / rms(oL, a, b));
    ok('stereo isolation (L only)', leak < -60, `R/L=${leak.toFixed(1)}dB`);
  }

  // 5. 左右の位相差が保たれるか（L と R が 90° ずれた正弦波）
  {
    const dsp = new PitchShifterDSP(N, OV);
    dsp.setSemitones(4);
    const L = sine(440, 2, 0.5, 0), R = sine(440, 2, 0.5, Math.PI / 2);
    const [oL, oR] = run(dsp, L, R, 128);
    const a = SR | 0, b = L.length;
    // 相関から位相差を推定: cos(dphi) = <L,R> / (|L||R|)
    let s = 0, sl = 0, sr = 0;
    for (let i = a; i < b; i++) { s += oL[i] * oR[i]; sl += oL[i] * oL[i]; sr += oR[i] * oR[i]; }
    const dphi = Math.acos(s / Math.sqrt(sl * sr)) * 180 / Math.PI;
    ok('stereo phase preserved (90deg)', Math.abs(dphi - 90) < 5, `dphi=${dphi.toFixed(1)}deg`);
  }

  // 6. 和音（ドミソ）を +4 半音
  {
    const dsp = new PitchShifterDSP(N, OV);
    dsp.setSemitones(4);
    const fs = [261.63, 329.63, 392.0];
    const n = SR * 3;
    const L = new Float32Array(n);
    for (const f of fs) { const s = sine(f, 3, 0.25); for (let i = 0; i < n; i++) L[i] += s[i]; }
    const [oL] = run(dsp, L, L, 128);
    // 出力の 1 区間を大きい FFT で解析
    const M = 32768;
    const seg = new Float64Array(M), segI = new Float64Array(M);
    for (let i = 0; i < M; i++) seg[i] = oL[SR + i] * (0.5 - 0.5 * Math.cos(2 * Math.PI * i / M));
    const ana = new PitchShifterDSP(M, 4);
    ana.re.set(seg); ana.im.fill(0); ana._fft(false);
    const mags = new Float64Array(M / 2);
    for (let k = 0; k < M / 2; k++) mags[k] = Math.hypot(ana.re[k], ana.im[k]);
    const found = [];
    for (const f of fs) {
      const ef = f * Math.pow(2, 4 / 12);
      const c = Math.round(ef * M / SR);
      let bk = c;
      for (let k = c - 6; k <= c + 6; k++) if (mags[k] > mags[bk]) bk = k;
      const al = mags[bk - 1], be = mags[bk], ga = mags[bk + 1];
      const off = 0.5 * (al - ga) / (al - 2 * be + ga);
      const pf = (bk + off) * SR / M;
      found.push([ef, pf, 1200 * Math.log2(pf / ef)]);
    }
    const worst = Math.max(...found.map((x) => Math.abs(x[2])));
    ok('chord C-E-G +4st', worst < 5, found.map((x) => `${x[0].toFixed(1)}->${x[1].toFixed(1)}Hz(${x[2].toFixed(1)}c)`).join(' '));
  }

  // 7. ブロック長に依存しないか（AudioWorklet=128 と ScriptProcessor=4096）
  {
    const d1 = new PitchShifterDSP(N, OV), d2 = new PitchShifterDSP(N, OV);
    d1.setSemitones(3); d2.setSemitones(3);
    const L = noise(1, 3), R = noise(1, 5);
    const [a1] = run(d1, L, R, 128);
    const [a2] = run(d2, L, R, 4096);
    let e = 0;
    for (let i = 0; i < a1.length; i++) e = Math.max(e, Math.abs(a1[i] - a2[i]));
    ok('block-size independence', e < 1e-6, `maxDiff=${e.toExponential(2)}`);
  }

  // 8. 再生中にピッチを頻繁に変えても破綻しないか
  {
    const dsp = new PitchShifterDSP(N, OV);
    const L = noise(5, 11), R = noise(5, 13);
    for (let i = 0; i < L.length; i++) { L[i] *= 0.3; R[i] *= 0.3; }
    const oL = new Float32Array(L.length), oR = new Float32Array(L.length);
    let bad = false, mx = 0;
    for (let i = 0, blk = 0; i < L.length; i += 128, blk++) {
      if (blk % 40 === 0) dsp.setSemitones(Math.round((Math.sin(blk) * 6) * 2) / 2);
      dsp.process(L.subarray(i, i + 128), R.subarray(i, i + 128), oL.subarray(i, i + 128), oR.subarray(i, i + 128), 128);
    }
    for (let i = 0; i < oL.length; i++) { if (!isFinite(oL[i]) || !isFinite(oR[i])) bad = true; mx = Math.max(mx, Math.abs(oL[i]), Math.abs(oR[i])); }
    ok('rapid pitch changes stable', !bad && mx < 1.5, `maxAbs=${mx.toFixed(3)} (input max 0.3)`);
  }

  // 9. 処理速度
  {
    const dsp = new PitchShifterDSP(N, OV);
    dsp.setSemitones(2);
    const L = noise(10, 21), R = noise(10, 23);
    const t0 = performance.now();
    run(dsp, L, R, 128);
    const ms = performance.now() - t0;
    ok('performance (10s stereo)', ms < 3000, `${ms.toFixed(0)}ms => ${(10000 / ms).toFixed(1)}x realtime`);
  }

  const fails = results.filter((r) => r.startsWith('FAIL')).length;
  document.getElementById('out').textContent = results.join('\n') + `\n\n${results.length - fails}/${results.length} passed`;
})();
</script>
</body>
</html>
